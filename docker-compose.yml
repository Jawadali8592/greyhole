services:
  greyhole:
    build:
      context: .
      args:
        # Baked into the client bundle at build time - rebuild to change it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.greyhole.live}
    container_name: greyhole
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
